[project]
name = "perplexity-deep-research"
version = "0.5.0"
description = "Perplexity Deep Research + Grok chat MCP server (macOS, Linux & Windows)"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "pycookiecheat>=0.8.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "secretstorage>=3.3.0; sys_platform == 'linux'",
    "playwright>=1.59.0",
    "playwright-stealth>=2.0.0",
    "patchright>=1.59.0",
    "rookiepy>=0.5.0; sys_platform == 'win32'",
    "pywin32>=300; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
perplexity-deep-research = "perplexity_deep_research.server:main"
perplexity-deep-research-config = "perplexity_deep_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["perplexity_deep_research"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
